name: macOS apps

on:
  push:
    branches: ['claude/**', 'main']
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish a GitHub Release with the built apps'
        type: boolean
        default: false
      screenshots:
        description: 'Launch both apps on the runner and capture screenshots'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: mac-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-tests:
    name: Game web tests (Playwright)
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    steps:
      - uses: actions/checkout@v5
      - name: Install Playwright package (browsers are preinstalled in the image)
        working-directory: mac/tests
        run: npm install --no-save --no-audit --no-fund playwright@1.56.1
      - name: Simulation unit tests (Node)
        run: node mac/tests/sim.test.mjs
      - name: Balance report (AI dispatcher, 12 seeds)
        run: node mac/tests/balance.mjs 12 6 12
      - name: Browser tests (Playwright)
        run: node mac/tests/run-web-tests.mjs

  mac:
    name: Build .app bundles (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain info
        run: |
          sw_vers
          xcodebuild -version
          swift --version
      - name: Swift unit tests
        run: |
          for p in mac/*/Package.swift; do
            d="$(dirname "$p")"
            if [ -d "$d/Tests" ]; then
              echo "==> swift test in $d"
              (cd "$d" && swift test)
            fi
          done
      - name: Build apps
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          mkdir -p dist
          for p in mac/*/app.conf; do
            d="$(dirname "$p")"
            scripts/build-mac-app.sh "$d" dist
          done
          rm -rf dist/*.app
          ls -la dist
      - name: Screenshots of the running apps
        if: github.event_name == 'workflow_dispatch' && inputs.screenshots
        run: |
          set +e
          mkdir -p shots
          ditto -x -k dist/ClipMint-*-mac.zip shots
          ditto -x -k dist/Approach-*-mac.zip shots
          system_profiler SPDisplaysDataType | grep -i resolution || true
          defaults write dev.joofam.clipmint language ko
          open shots/ClipMint.app
          sleep 5
          printf '%s' '안녕하세요, 이장수입니다. 첨부한 인증서 사본을 확인 부탁드립니다.' | pbcopy; sleep 1
          printf '%s' 'https://eur-lex.europa.eu/eli/reg/2017/745/oj' | pbcopy; sleep 1
          printf '%s' 'The manufacturer shall ensure that the device is de-
          signed and manufactured in accordance with the require-
          ments of this Regulation.' | pbcopy; sleep 1
          printf '%s' '#1a73e8' | pbcopy; sleep 1
          printf '%s' 'KR25/00000112 Issue 5 — Niti-S Pyloric stent (Class IIb)' | pbcopy; sleep 2
          screencapture -x -t png shots/clipmint-full.png
          ls -la shots
          osascript -e 'tell application "ClipMint" to quit' || true
          open shots/Approach.app
          sleep 8
          screencapture -x -t png shots/approach-full.png
          osascript -e 'tell application "Approach" to quit' || true
          rm -rf shots/*.app
          ls -la shots
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch' && inputs.screenshots
        with:
          name: screenshots
          path: shots/*.png
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: mac-apps
          path: |
            dist/*.zip
            dist/*.dmg
          if-no-files-found: error
      - name: Publish release
        if: >-
          (github.event_name == 'workflow_dispatch' && inputs.publish) ||
          (github.event_name == 'push' && contains(github.event.head_commit.message, '[release]'))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mac-v1.0.${{ github.run_number }}
          name: 맥북 앱·게임 1.0 (build ${{ github.run_number }})
          prerelease: false
          files: |
            dist/*.dmg
            dist/*.zip
          body_path: mac/RELEASE_NOTES.md
