<title>하루</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&display=swap">
<style>
:root{
  --bg:#F3F4F0; --surface:#FFFFFF; --surface-2:#ECEEE8; --surface-3:#DFE2DA; --seg-on:#FFFFFF;
  --ink:#15171C; --ink-2:#5B6158; --ink-3:#8C9288;
  --line:rgba(21,23,28,.08);
  --accent:#2A57C9; --accent-ink:#FFFFFF; --accent-soft:rgba(42,87,201,.10);
  --sun:#EE9F2F; --good:#15915A; --bad:#D1413D; --warn:#B97800;
  --shadow:0 1px 1px rgba(21,23,28,.04), 0 6px 20px rgba(21,23,28,.05);
  --bar:rgba(246,247,244,.84); --sheet:#FFFFFF; --overlay:rgba(12,14,18,.36);
  --toast-bg:#15171C; --toast-ink:#F3F4F0; --toast-act:#9DB5FF;
  --font:-apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", "Malgun Gothic", system-ui, sans-serif;
  --display:"Gowun Batang", "AppleMyungjo", "Nanum Myeongjo", "Noto Serif KR", serif;
  --r:20px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D0F12; --surface:#171A1F; --surface-2:#22262D; --surface-3:#2D323A; --seg-on:#3A404B;
    --ink:#EDEFE9; --ink-2:#A3A89E; --ink-3:#6F756C;
    --line:rgba(237,239,233,.09);
    --accent:#86A4FF; --accent-ink:#0B1020; --accent-soft:rgba(134,164,255,.16);
    --sun:#F4B455; --good:#3CC585; --bad:#F06A64; --warn:#E3A32B;
    --shadow:0 0 0 1px rgba(255,255,255,.03);
    --bar:rgba(18,20,24,.86); --sheet:#1A1D22; --overlay:rgba(0,0,0,.55);
    --toast-bg:#EDEFE9; --toast-ink:#15171C; --toast-act:#2A57C9;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D0F12; --surface:#171A1F; --surface-2:#22262D; --surface-3:#2D323A; --seg-on:#3A404B;
  --ink:#EDEFE9; --ink-2:#A3A89E; --ink-3:#6F756C;
  --line:rgba(237,239,233,.09);
  --accent:#86A4FF; --accent-ink:#0B1020; --accent-soft:rgba(134,164,255,.16);
  --sun:#F4B455; --good:#3CC585; --bad:#F06A64; --warn:#E3A32B;
  --shadow:0 0 0 1px rgba(255,255,255,.03);
  --bar:rgba(18,20,24,.86); --sheet:#1A1D22; --overlay:rgba(0,0,0,.55);
  --toast-bg:#EDEFE9; --toast-ink:#15171C; --toast-act:#2A57C9;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.45;word-break:keep-all;overflow-wrap:break-word;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;text-align:inherit}
button:disabled{cursor:default}
input,select,textarea{font:inherit;font-size:16px;color:var(--ink)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--ink-2)}
.small{font-size:13px}

.page{max-width:560px;margin:0 auto;padding-inline:16px;padding-bottom:calc(108px + env(safe-area-inset-bottom,0px))}
.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding-block:20px 16px}
.hero h1{font-family:var(--display);font-weight:700;font-size:30px;line-height:1.15;margin:0;letter-spacing:-.01em;text-wrap:balance}
.eyebrow{font-size:13px;color:var(--ink-2);font-weight:600;letter-spacing:.02em;margin-bottom:6px}
.hero-actions{display:flex;gap:8px;flex:none}
.icon-btn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--surface);box-shadow:var(--shadow);color:var(--ink);flex:none;transition:transform .12s}
.icon-btn.primary{background:var(--accent);color:var(--accent-ink);box-shadow:none}
.icon-btn svg{width:20px;height:20px}
.icon-btn:active,.btn:active,.chip:active{transform:scale(.96)}

.stack{display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.card-h h2{font-size:15px;font-weight:700;margin:0}
.card-h .meta{font-size:13px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.link{color:var(--accent);font-weight:600;font-size:14px;padding:4px 0}
.big{font-size:30px;font-weight:750;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.1}
.row-between{display:flex;align-items:baseline;justify-content:space-between;gap:12px}

.dayline{display:flex;justify-content:space-between;gap:12px;font-size:13px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.pbar{height:6px;border-radius:6px;background:var(--surface-3);overflow:hidden;margin-top:8px}
.pbar i{display:block;height:100%;border-radius:6px;background:var(--c,var(--accent));transition:width .4s}
.daybar{height:4px;margin:8px 0 18px}
.daybar i{background:var(--sun)}

.banner{display:flex;gap:10px;align-items:center;justify-content:space-between;background:var(--accent-soft);border-radius:16px;padding:12px 12px 12px 14px;font-size:14px;line-height:1.35}
.banner .acts{display:flex;gap:6px;flex:none}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:46px;padding:0 18px;border-radius:14px;font-weight:650;font-size:15px;background:var(--surface-2);color:var(--ink);transition:transform .12s}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--bad)}
.btn.danger.armed{background:var(--bad);color:#fff}
.btn.block{width:100%}
.btn.sm{height:34px;padding:0 12px;border-radius:10px;font-size:14px}
.btn:disabled{opacity:.4}
.btn svg{width:18px;height:18px}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}
.btn-row .btn{flex:1 1 140px}

/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;background:var(--bar);-webkit-backdrop-filter:saturate(1.6) blur(18px);backdrop-filter:saturate(1.6) blur(18px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs-in{display:grid;grid-template-columns:repeat(5,1fr);width:100%;max-width:560px}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 6px;font-size:10.5px;font-weight:600;color:var(--ink-3);text-align:center}
.tab svg{width:25px;height:25px}
.tab[aria-current="page"]{color:var(--accent)}

/* habits */
.hgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px 8px;padding-block:8px 4px}
@media (min-width:480px){.hgrid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.habit{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation;min-width:0}
.ring{position:relative;width:88px;aspect-ratio:1;max-width:100%}
.ring svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.ring .track{stroke:var(--surface-3)}
.ring .prog{stroke:var(--c);transition:stroke-dashoffset .4s cubic-bezier(.2,.8,.2,1)}
.ring .face{position:absolute;inset:12%;border-radius:50%;display:grid;place-items:center;font-size:30px;line-height:1;background:var(--surface);transition:background .25s}
.habit.done .face{background:var(--c)}
.habit.off .face{opacity:.55}
.habit .hn{font-size:14px;font-weight:650;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.habit .hs{font-size:12px;color:var(--ink-2);font-variant-numeric:tabular-nums;margin-top:-4px}
.habit .hs.hot{color:color-mix(in srgb,var(--sun) 70%,var(--ink))}
.habit.add .face{background:transparent;border:2px dashed var(--surface-3);color:var(--ink-3);font-size:26px}
.habit.pop .ring{animation:pop .38s ease}
@keyframes pop{40%{transform:scale(1.09)}}
.mini-row{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(58px,1fr);gap:8px;overflow-x:auto;padding:2px 2px 4px;margin:0 -2px;scrollbar-width:none}
.mini-row::-webkit-scrollbar{display:none}
.mini-row .habit{width:100%}
.mini-row .ring{width:56px}
.mini-row .face{font-size:22px}
.mini-row .hn{font-size:12px;font-weight:600}

.week{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;background:var(--surface);border-radius:18px;padding:6px;box-shadow:var(--shadow);margin-bottom:6px}
.wd{display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 0 6px;border-radius:13px;font-size:12px;color:var(--ink-2);text-align:center}
.wd b{font-size:15px;color:var(--ink);font-variant-numeric:tabular-nums}
.wd svg{width:16px;height:16px;transform:rotate(-90deg)}
.wd[aria-pressed="true"]{background:var(--accent-soft)}
.wd[aria-pressed="true"] b{color:var(--accent)}
.hint{font-size:12.5px;color:var(--ink-3);text-align:center;margin-top:18px}

.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.stat{background:var(--surface-2);border-radius:14px;padding:10px 4px;text-align:center}
.stat b{display:block;font-size:19px;font-variant-numeric:tabular-nums;line-height:1.25}
.stat span{font-size:11.5px;color:var(--ink-2)}
.heat-wrap{margin-top:16px}
.hmonths{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:3px;font-size:10.5px;color:var(--ink-3);height:14px;margin-bottom:4px;white-space:nowrap}
.heat{display:grid;grid-template-rows:repeat(7,auto);grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:3px}
.heat button{aspect-ratio:1;border-radius:4px;background:color-mix(in srgb,var(--c) var(--p,0%),var(--surface-2))}
.heat button.fut{visibility:hidden}
.heat button.today{box-shadow:0 0 0 1.5px var(--ink)}
.heat button.rest{background:transparent;box-shadow:inset 0 0 0 1px var(--surface-3)}
.legend-s{display:flex;align-items:center;justify-content:flex-end;gap:4px;font-size:11px;color:var(--ink-3);margin-top:8px}
.legend-s i{width:11px;height:11px;border-radius:3px;display:inline-block;background:color-mix(in srgb,var(--c) var(--p),var(--surface-2))}

/* money */
.mnav{display:flex;align-items:center;gap:4px}
.mnav .icon-btn{width:34px;height:34px;box-shadow:none;background:var(--surface-2)}
.mnav .icon-btn svg{width:16px;height:16px}
.mnav .icon-btn:disabled{opacity:.3}
.catbar{display:flex;height:12px;border-radius:6px;overflow:hidden;gap:2px;background:var(--surface-2)}
.catbar i{display:block;height:100%;background:var(--c)}
.legend{display:grid;gap:10px;margin-top:14px}
.lrow{display:grid;grid-template-columns:30px minmax(0,1fr) auto 44px;align-items:center;gap:10px;font-size:14px}
.lrow .pct{text-align:right;color:var(--ink-2);font-size:13px;font-variant-numeric:tabular-nums}
.dot{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:15px;line-height:1;background:color-mix(in srgb,var(--c) 20%,transparent)}
.days{display:flex;align-items:flex-end;gap:2px;height:76px;margin-top:10px}
.days i{flex:1;min-width:0;background:var(--surface-3);border-radius:2px 2px 0 0;min-height:2px}
.days i.on{background:color-mix(in srgb,var(--accent) 45%,var(--surface-3))}
.days i.today{background:var(--accent)}
.days i.fut{background:var(--surface-2)}
.days-ax{display:flex;justify-content:space-between;font-size:11px;color:var(--ink-3);margin-top:4px;font-variant-numeric:tabular-nums}
.group-h{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--ink-2);font-weight:600;margin:6px 6px 8px;font-variant-numeric:tabular-nums}
.list{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.item{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 16px;width:100%;text-align:left}
.item + .item{border-top:1px solid var(--line)}
.item .t1{font-weight:600;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .t2{font-size:13px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .r{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.amt{font-weight:650;font-variant-numeric:tabular-nums;white-space:nowrap}
.amt.in{color:var(--good)}
.fab{position:fixed;right:max(16px,calc(50% - 264px));bottom:calc(74px + env(safe-area-inset-bottom,0px));z-index:19;height:52px;padding:0 20px 0 16px;border-radius:26px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:16px;display:flex;align-items:center;gap:6px;box-shadow:0 8px 24px rgba(42,87,201,.32);transition:transform .12s}
.fab svg{width:22px;height:22px}
.fab:active{transform:scale(.96)}
.over{color:var(--bad)}

/* subs */
.sico{width:40px;height:40px;border-radius:12px;background:var(--c);color:#fff;display:grid;place-items:center;font-weight:800;font-size:17px}
.dchip{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);font-variant-numeric:tabular-nums;white-space:nowrap}
.dchip.soon{background:color-mix(in srgb,var(--bad) 15%,transparent);color:var(--bad)}
.dchip.now{background:var(--bad);color:#fff}
.split{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.split b{display:block;font-size:16px;font-variant-numeric:tabular-nums;line-height:1.35}
.split span{font-size:12.5px;color:var(--ink-2)}
.section-h{font-size:13px;font-weight:700;color:var(--ink-2);margin:10px 6px 0}
.dim{opacity:.55}

/* d-day */
.dgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.dcard{background:var(--surface);border-radius:var(--r);padding:14px 14px 16px;box-shadow:var(--shadow);text-align:left;display:flex;flex-direction:column;gap:4px;min-height:136px;min-width:0}
.dcard .dt{display:flex;align-items:center;gap:6px;font-size:14px;font-weight:650;min-width:0}
.dcard .dt span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dcard .dt i{width:8px;height:8px;border-radius:50%;background:var(--c);flex:none}
.dcard .dn{font-family:var(--display);font-size:34px;font-weight:700;line-height:1.05;color:color-mix(in srgb,var(--c) 78%,var(--ink));font-variant-numeric:tabular-nums;margin-top:auto;letter-spacing:-.01em}
.dcard .dn small{font-size:16px;margin-left:2px}
.dcard .dd{font-size:12px;color:var(--ink-2)}
.dcard .pbar{height:4px;margin-top:6px}
.dmini{min-height:0;padding:12px 12px 13px;box-shadow:none;background:var(--surface-2)}
.dmini .dn{font-size:26px}
.ms{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:11px 0;border-top:1px solid var(--line);font-size:14px}
.ms:first-child{border-top:0}
.ms.past{color:var(--ink-3)}
.ms .when{font-size:13px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.ms.next b{color:var(--accent)}

/* sheet */
.backdrop{position:fixed;inset:0;background:var(--overlay);z-index:40;opacity:0;transition:opacity .25s}
.backdrop.show{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;margin:0 auto;max-width:560px;max-height:calc(100% - 24px - env(safe-area-inset-top,0px));display:flex;flex-direction:column;background:var(--sheet);border-radius:22px 22px 0 0;transform:translateY(105%);transition:transform .32s cubic-bezier(.2,.8,.2,1);padding-bottom:env(safe-area-inset-bottom,0px);box-shadow:0 -10px 40px rgba(0,0,0,.12)}
.sheet.show{transform:none}
.sheet-h{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:16px 10px 8px;position:relative;flex:none}
.sheet-h::before{content:"";position:absolute;top:6px;left:50%;width:36px;height:5px;margin-left:-18px;border-radius:3px;background:var(--surface-3)}
.sheet-h h3{grid-column:2;margin:0;font-size:16px;font-weight:700;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:60vw}
.sheet-h .l{justify-self:start}
.sheet-h .r{justify-self:end}
.txt-btn{height:36px;padding:0 10px;border-radius:10px;font-weight:600;color:var(--accent);font-size:16px}
.txt-btn.strong{font-weight:750}
.sheet-b{overflow-y:auto;padding:4px 16px 22px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.field{display:flex;flex-direction:column;gap:8px;margin-top:18px}
.flabel{font-size:13px;font-weight:650;color:var(--ink-2)}
.input{height:48px;border-radius:14px;border:1px solid var(--line);background:var(--surface-2);padding:0 14px;width:100%;min-width:0;-webkit-appearance:none;appearance:none}
input[type="date"].input{display:flex;align-items:center}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);background:var(--surface-2);border-radius:12px;padding:3px;gap:3px}
.seg button{height:36px;border-radius:9px;font-size:14px;font-weight:600;color:var(--ink-2);text-align:center}
.seg button[aria-pressed="true"]{background:var(--seg-on);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.swatches{display:flex;flex-wrap:wrap;gap:10px}
.sw{width:34px;height:34px;border-radius:50%;background:var(--c)}
.sw[aria-pressed="true"]{box-shadow:0 0 0 3px var(--sheet),0 0 0 5px var(--c)}
.emojis{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:6px}
.emojis button{aspect-ratio:1;border-radius:12px;font-size:21px;line-height:1;background:var(--surface-2);display:grid;place-items:center}
.emojis button[aria-pressed="true"]{background:var(--accent-soft);box-shadow:inset 0 0 0 2px var(--accent)}
.stepper{display:flex;align-items:center;gap:10px}
.stepper button{width:44px;height:44px;border-radius:12px;background:var(--surface-2);font-size:22px;font-weight:600;text-align:center}
.stepper output{min-width:48px;text-align:center;font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{height:34px;padding:0 13px;border-radius:17px;background:var(--surface-2);font-size:14px;font-weight:600;color:var(--ink);transition:transform .12s}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.amount{font-size:40px;font-weight:750;text-align:center;font-variant-numeric:tabular-nums;letter-spacing:-.02em;padding:8px 0 4px}
.amount.zero{color:var(--ink-3)}
.cats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.cat{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 2px;border-radius:14px;font-size:12px;font-weight:600;color:var(--ink-2);text-align:center;min-width:0}
.cat .dot{width:36px;height:36px;font-size:18px}
.cat span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cat[aria-pressed="true"]{background:var(--accent-soft);color:var(--ink)}
.kpad{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:16px}
.kpad button{height:50px;border-radius:14px;background:var(--surface-2);font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;text-align:center;display:grid;place-items:center}
.kpad button:active{background:var(--surface-3)}
.kpad svg{width:24px;height:24px}
.info{display:grid;gap:0;margin-top:6px}
.info div{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-top:1px solid var(--line);font-size:14px}
.info div:first-child{border-top:0}
.info b{font-variant-numeric:tabular-nums;text-align:right}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--line);font-size:15px}
.set-row:first-child{border-top:0}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-2)}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--ink-3)}
.sync.ok i{background:var(--good)}
.sync.busy i{background:var(--sun)}
.sync.err i{background:var(--bad)}

    while (S.dirty.size || S.deleted.size) {
      if (S.dirty.size) {

async function initSync() {
  const [db, user] = await Promise.all([use('db'), use('user')]);
  let id = null;
  if (db && user) { try { id = await user.id(); } catch { id = null; } }
  if (!db || !id) {
    S.mode = 'local';
    if (S.ephemeral) { S.ephemeral = false; Object.keys(S.docs).forEach(k => S.dirty.add(k)); lsSave(); }
    setSync('local');
    return;
  }
  S.mode = 'cloud'; setSync('connecting');
  try { S.col = db.collection('data/users/' + id); } catch { S.mode = 'local'; setSync('local'); return; }

    if (err && err.code === 'unavailable') setTimeout(() => { S.synced = false; S.col.onSnapshot(onSnap, () => setSync('err')); }, 3000);

function onSnap(snap) {
  if (!S.synced) {
    if (snap.metadata && snap.metadata.fromCache) return;
    S.synced = true;
    const server = {};
    snap.docs.forEach(d => { if (d.exists) server[d.id] = clone(d.data()); });
    const serverEmpty = Object.keys(server).length === 0;
    if (S.ephemeral) {
      S.ephemeral = false;
      if (serverEmpty) Object.keys(S.docs).forEach(k => S.dirty.add(k));
      else { S.docs = server; S.dirty.clear(); }
    } else if (serverEmpty) {
      Object.keys(S.docs).forEach(k => S.dirty.add(k));
    } else {
      for (const k of Object.keys(S.docs)) if (!(k in server) && !S.dirty.has(k)) delete S.docs[k];
      for (const [k, v] of Object.entries(server)) if (!S.dirty.has(k) && !S.deleted.has(k)) S.docs[k] = v;

    lsSave(); renderAll(); setSync('ok');
    if (S.dirty.size || S.deleted.size) flush();

  let changed = false;
  snap.docChanges().forEach(ch => {
    const k = ch.doc.id;
    if (S.dirty.has(k) || S.inflight.has(k) || S.deleted.has(k)) return;

const subs = () => core().subs || (core().subs = []);

function renderAll() { render(); if (SH && SH.live) drawSheet(); }

/* ───────── 시트 ───────── */
let SH = null;
function openSheet(o) {
  closeSheet(true);
  const root = $('#sheet-root');
  const bd = document.createElement('div'); bd.className = 'backdrop';
  const el = document.createElement('section'); el.className = 'sheet'; el.setAttribute('role', 'dialog'); el.setAttribute('aria-modal', 'true'); el.setAttribute('aria-label', o.title);
  root.append(bd, el);
  SH = Object.assign({ acts: {} }, o, { el, bd });
  SH.acts.close = SH.acts.close || (() => closeSheet());
  document.body.classList.add('sheet-open'); $('#toast').classList.remove('show'); toastUndo = null;
  drawSheet();
  requestAnimationFrame(() => requestAnimationFrame(() => { bd.classList.add('show'); el.classList.add('show'); }));
  bd.addEventListener('click', () => closeSheet());
  el.addEventListener('click', e => {
    const b = e.target.closest('[data-s]'); if (!b || !SH || SH.el !== el) return;
    const f = SH.acts[b.dataset.s]; if (f) { e.preventDefault(); f(b, e); }
  });
  el.addEventListener('input', e => { if (SH && SH.el === el && SH.onInput) SH.onInput(e); });
  el.addEventListener('change', e => { if (SH && SH.el === el && SH.onInput) SH.onInput(e); });
}
function drawSheet() {
  if (!SH) return;
  const body = SH.el.querySelector('.sheet-b'), top = body ? body.scrollTop : 0;
  SH.el.innerHTML = `<header class="sheet-h"><div class="l"><button class="txt-btn" data-s="close">${SH.cancel || '닫기'}</button></div><h3>${esc(SH.title)}</h3><div class="r">${SH.right || ''}</div></header><div class="sheet-b">${SH.body()}</div>`;
  SH.el.querySelector('.sheet-b').scrollTop = top;
}
function closeSheet(now) {
  if (!SH) return;
  const { el, bd } = SH; SH = null;
  document.body.classList.remove('sheet-open');
  if (now) { el.remove(); bd.remove(); return; }
  el.classList.remove('show'); bd.classList.remove('show');
  setTimeout(() => { el.remove(); bd.remove(); }, 320);
}
function armDelete(b, fn) {
  if (b.classList.contains('armed')) { fn(); return; }
  b.classList.add('armed'); b.textContent = '한 번 더 누르면 삭제돼요';
  setTimeout(() => { if (b.isConnected) { b.classList.remove('armed'); b.textContent = b.dataset.label || '삭제'; } }, 3500);
}
const seg = (name, val, opts) => `<div class="seg" role="group">${opts.map(([v, l]) => `<button type="button" data-s="${name}" data-v="${v}" aria-pressed="${String(val) === String(v)}">${l}</button>`).join('')}</div>`;
const swatches = (val) => `<div class="swatches">${COLORS.map(c => `<button type="button" class="sw" style="--c:${c}" data-s="color" data-v="${c}" aria-pressed="${val === c}" aria-label="색 ${c}"></button>`).join('')}</div>`;

      <div class="field"><span class="flabel">언제 할까요</span>${seg('stype', d.schedule.type, [['daily', '매일'], ['days', '요일 지정'], ['weekly', '주 N회']])}

        ${d.schedule.type === 'weekly' ? `<div class="stepper" style="margin-top:4px"><button type="button" data-s="pminus" aria-label="줄이기">−</button><output class="num">${d.schedule.perWeek}회</output><button type="button" data-s="pplus" aria-label="늘리기">+</button><span class="muted small">한 주에 이만큼 하면 성공</span></div>` : ''}
      </div>
      <p class="note">연속 기록은 정한 날만 세요. 하루 놓쳐도 최근 30일 달성률로 흐름을 볼 수 있어요.</p>

    acts: {

      pminus: () => { d.schedule.perWeek = Math.max(1, d.schedule.perWeek - 1); drawSheet(); },

/* 습관 상세 (통계 + 달력) */
function habitDetail(id) {
  const h0 = habitById(id); if (!h0) return;
  openSheet({
    title: h0.name, live: true,
    right: '<button class="txt-btn" data-s="edit">편집</button>',
    body: () => {
      const h = habitById(id); if (!h) { setTimeout(() => closeSheet(), 0); return ''; }
      const st = streakOf(h), best = bestStreak(h), r = rate30(h), tot = totalDone(h), t = today(), tk = ymd(t);
      const ws = weekStartOf(t), start = addDays(ws, -7 * 16);
      const cells = [], months = [];
      for (let c = 0; c < 17; c++) {
        const colStart = addDays(start, c * 7);
        const first = [...Array(7)].map((_, i) => addDays(colStart, i)).find(d => d.getDate() === 1);
        months.push(`<span>${c === 0 ? `${colStart.getMonth() + 1}월` : first ? `${first.getMonth() + 1}월` : ''}</span>`);
        for (let i = 0; i < 7; i++) {
          const d = addDays(colStart, i), k = ymd(d);
          if (k > tk) { cells.push('<button class="fut" tabindex="-1" aria-hidden="true"></button>'); continue; }
          const n = hCount(h, k), ratio = Math.min(1, n / (h.target || 1));
          const rest = !isSched(h, d) && !n;
          cells.push(`<button class="${k === tk ? 'today' : ''}${rest ? ' rest' : ''}" style="--p:${ratio ? Math.round(30 + ratio * 70) : 0}%" data-s="cell" data-v="${k}" aria-label="${mdw(d)} ${n}/${h.target || 1}"></button>`);
        }
      }
      const tn = hCount(h, tk);
      return `<div style="display:flex;align-items:center;gap:14px;margin:6px 0 18px"><div class="habit${isDone(h, tk) ? ' done' : ''}" style="--c:${h.color};pointer-events:none"><div class="ring" style="width:64px">${ringSVG(tn / (h.target || 1), 64, 5)}<div class="face" style="font-size:24px">${esc(h.emoji)}</div></div></div>
        <div style="min-width:0"><div style="font-size:20px;font-weight:750">${esc(h.name)}</div><div class="muted small">${schedText(h)} · 하루 ${h.target || 1}${esc(h.unit || '회')} · 오늘 ${tn}${esc(h.unit || '')}</div></div></div>
        <div class="stats"><div class="stat"><b>${st.n}</b><span>현재 연속(${st.unit})</span></div><div class="stat"><b>${best}</b><span>최고 기록(${st.unit})</span></div><div class="stat"><b>${r === null ? '–' : Math.round(r * 100) + '%'}</b><span>30일 달성률</span></div><div class="stat"><b>${tot}</b><span>총 달성일</span></div></div>
        <div class="heat-wrap" style="--c:${h.color}"><div class="hmonths">${months.join('')}</div><div class="heat">${cells.join('')}</div>
        <div class="legend-s">적음 <i style="--p:0%"></i><i style="--p:40%"></i><i style="--p:70%"></i><i style="--p:100%"></i> 많음</div></div>
        <p class="note">칸을 누르면 그날 기록을 고칠 수 있어요. 테두리만 있는 칸은 쉬는 날이에요.</p>
        <div class="btn-row" style="margin-top:14px"><button class="btn" data-s="minus" ${tn ? '' : 'disabled'}>오늘 −1</button><button class="btn primary" data-s="plus">오늘 +1</button></div>`;
    },
    acts: {
      edit: () => { const h = habitById(id); if (h) habitEditor(h); },
      cell: b => tapHabit(id, b.dataset.v),
      plus: () => { const h = habitById(id); const before = snapDocs([hlogId(todayKey())]); hSet(h, todayKey(), hCount(h, todayKey()) + 1); renderAll(); toast(`${h.name} ${hCount(h, todayKey())}${h.unit || '회'}`, before); },

    },
  });
}

/* ───────── 파일 (백업·엑셀) ───────── */
async function saveFile(filename, data, mime) {
  const dl = await use('downloads');
  if (dl) {
    try { const r = await dl.save({ filename, data }); if (r && r.status === 'saved') toast('파일을 저장했어요'); }
    catch (e) { if (e && e.code === 'declined') return; toast(e && e.code === 'rate_limited' ? '잠시 뒤 다시 눌러 주세요' : '이 화면에서는 파일을 저장할 수 없어요'); }
    return;
  }
  try {
    const blob = data instanceof Blob ? data : new Blob([data], { type: mime });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename;
    document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
  } catch { toast('이 화면에서는 파일을 저장할 수 없어요'); }
}

function sheetXml(rows, widths) {

    const ref = colName(ci) + (ri + 1);
    if (typeof v === 'number') return `<c r="${ref}" s="2"><v>${v}</v></c>`;
    return `<c r="${ref}" t="inlineStr"${ri === 0 ? ' s="1"' : ''}><is><t xml:space="preserve">${xmlEsc(v)}</t></is></c>`;
  }).join('')}</row>`).join('');
  return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews><cols>${widths.map((w, i) => `<col min="${i + 1}" max="${i + 1}" width="${w}" customWidth="1"/>`).join('')}</cols><sheetData>${body}</sheetData></worksheet>`;
}
function xlsxBlob(sheets) {
  const X = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>';
  const f = {};
  f['[Content_Types].xml'] = `${X}<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>${sheets.map((s, i) => `<Override PartName="/xl/worksheets/sheet${i + 1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join('')}</Types>`;
  f['_rels/.rels'] = `${X}<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>`;
  f['xl/workbook.xml'] = `${X}<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>${sheets.map((s, i) => `<sheet name="${xmlEsc(s.name)}" sheetId="${i + 1}" r:id="rId${i + 1}"/>`).join('')}</sheets></workbook>`;
  f['xl/_rels/workbook.xml.rels'] = `${X}<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">${sheets.map((s, i) => `<Relationship Id="rId${i + 1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i + 1}.xml"/>`).join('')}<Relationship Id="rId${sheets.length + 1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`;
  f['xl/styles.xml'] = `${X}<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><numFmts count="1"><numFmt numFmtId="164" formatCode="#,##0"/></numFmts><fonts count="2"><font><sz val="11"/><name val="맑은 고딕"/></font><font><b/><sz val="11"/><name val="맑은 고딕"/></font></fonts><fills count="3"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill><fill><patternFill patternType="solid"><fgColor rgb="FFECEEE8"/><bgColor indexed="64"/></patternFill></fill></fills><borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="3"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="1" fillId="2" borderId="0" xfId="0" applyFont="1" applyFill="1"/><xf numFmtId="164" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/></cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>`;
  sheets.forEach((s, i) => { f[`xl/worksheets/sheet${i + 1}.xml`] = sheetXml(s.rows, s.widths); });
  return zipStore(f);
}
function exportXlsx() {
  const months = Object.keys(S.docs).filter(k => /^tx-\d{4}-\d{2}$/.test(k)).map(k => k.slice(3)).sort();
  if (!months.length) { toast('내보낼 가계부 기록이 없어요'); return; }
  const rows = [['날짜', '구분', '분류', '금액(원)', '메모']], sum = [['월', '지출(원)', '수입(원)', '수입−지출(원)']];
  months.forEach(m => {
    const st = monthStats(m);
    st.items.forEach(t => rows.push([t.date, t.type === 'in' ? '수입' : '지출', catOf(t.type === 'in' ? 'in' : 'out', t.cat).n, t.amount, t.memo || '']));
    sum.push([m, st.out, st.inc, st.inc - st.out]);
  });
  saveFile(`하루-가계부-${todayKey()}.xlsx`, xlsxBlob([{ name: '내역', rows, widths: [12, 7, 12, 13, 28] }, { name: '월별 요약', rows: sum, widths: [10, 14, 14, 16] }]), 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet');
}

/* ───────── 토스트 ───────── */
let toastTimer = null, toastUndo = null;
function toast(msg, undo) {
  const el = $('#toast'); $('#toast-msg').textContent = msg;
  toastUndo = undo || null; $('#toast-act').hidden = !undo;
  el.classList.add('show'); clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.classList.remove('show'); toastUndo = null; }, undo ? 4500 : 2600);
}
$('#toast-act').addEventListener('click', () => { if (toastUndo) { const u = toastUndo; toastUndo = null; restoreDocs(u); } $('#toast').classList.remove('show'); });

/* ───────── 입력 처리 ───────── */
const ACT = {
  tab: b => { UI.tab = b.dataset.v; lsSet('haru.tab', UI.tab); render(); window.scrollTo(0, 0); },
  settings: () => settingsSheet(),
  habit: b => tapHabit(b.dataset.id, b.dataset.date),
  'habit-new': () => habitEditor(null),
  hday: b => { UI.hDate = b.dataset.v; render(); },
  'tx-new': () => txEditor(null),
  'tx-edit': b => { const t = txList(b.dataset.date.slice(0, 7)).find(x => x.id === b.dataset.id); if (t) txEditor(t); },
  mprev: () => { const [y, m] = UI.mMonth.split('-').map(Number); UI.mMonth = ymd(new Date(y, m - 2, 1)).slice(0, 7); render(); },
  mnext: () => { const [y, m] = UI.mMonth.split('-').map(Number); const n = ymd(new Date(y, m, 1)).slice(0, 7); if (n <= todayKey().slice(0, 7)) { UI.mMonth = n; render(); } },
  xlsx: () => exportXlsx(),
  'sub-new': () => subEditor(null),
  'sub-edit': b => { const s = subs().find(x => x.id === b.dataset.id); if (s) subEditor(s); },
  'dday-new': () => ddayEditor(null),
  'dday-open': b => ddayDetail(b.dataset.id),
  'clear-sample': () => clearSample(),
};
let lp = null;
document.addEventListener('pointerdown', e => {
  const b = e.target.closest('[data-lp]'); if (!b) return;
  lp = { b, x: e.clientX, y: e.clientY, fired: false };
  lp.t = setTimeout(() => { if (lp && lp.b === b) { lp.fired = true; habitDetail(b.dataset.id); } }, 480);
});
document.addEventListener('pointermove', e => { if (lp && !lp.fired && (Math.abs(e.clientX - lp.x) > 8 || Math.abs(e.clientY - lp.y) > 8)) { clearTimeout(lp.t); lp = null; } });
['pointerup', 'pointercancel'].forEach(t => document.addEventListener(t, () => { if (lp) clearTimeout(lp.t); }));
document.addEventListener('contextmenu', e => { if (e.target.closest('[data-lp]')) e.preventDefault(); });
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b || b.closest('.sheet')) return;
  if (lp && lp.fired && b.closest('[data-lp]')) { lp = null; e.preventDefault(); return; }
  lp = null;
  const f = ACT[b.dataset.act]; if (f) { e.preventDefault(); f(b, e); }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && SH) closeSheet(); });

/* ───────── 예시 데이터 ───────── */
const SAMPLE_BUDGET = 1500000;
function mulberry32(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function sampleDocs() {
  const t = today(), tk = ymd(t), rnd = mulberry32(925), docs = {};
  const c = emptyCore(); c.sample = true; c.settings.budget = SAMPLE_BUDGET;
  const created = ymd(addDays(t, -84));
  c.habits = [
    { id: 'ex-h1', name: '물 마시기', emoji: '💧', color: '#3B94E6', target: 8, unit: '잔', schedule: { type: 'daily' }, created },
    { id: 'ex-h2', name: '30분 걷기', emoji: '🚶', color: '#3DB86B', target: 1, unit: '', schedule: { type: 'daily' }, created },
    { id: 'ex-h3', name: '책 읽기', emoji: '📖', color: '#9760E0', target: 1, unit: '', schedule: { type: 'days', days: [1, 2, 3, 4, 5] }, created },
    { id: 'ex-h4', name: '스트레칭', emoji: '🧘', color: '#F2963A', target: 1, unit: '', schedule: { type: 'weekly', perWeek: 3 }, created },
    { id: 'ex-h5', name: '영양제', emoji: '💊', color: '#F2665E', target: 1, unit: '', schedule: { type: 'daily' }, created },
  ];
  const put = (hid, k, n) => { const id = 'hlog-' + k.slice(0, 4); const d = docs[id] || (docs[id] = { data: {} }); (d.data[hid] = d.data[hid] || {})[k] = n; };
  for (let i = 1; i <= 84; i++) {
    const d = addDays(t, -i), k = ymd(d), w = d.getDay();
    if (rnd() < .82) put('ex-h1', k, 8); else put('ex-h1', k, 3 + Math.floor(rnd() * 4));
    if (i <= 6 || rnd() < .72) put('ex-h2', k, 1);
    if (w >= 1 && w <= 5 && rnd() < .78) put('ex-h3', k, 1);
    if (rnd() < .5) put('ex-h4', k, 1);
    if (i <= 13 || rnd() < .86) put('ex-h5', k, 1);
  }
  put('ex-h1', tk, 3); put('ex-h5', tk, 1);

  const tx = (date, type, cat, amount, memo) => { const id = 'tx-' + date.slice(0, 7); (docs[id] = docs[id] || { items: [] }).items.push({ id: 'ex-' + uid(), type, cat, amount, memo, date, ts: 0 }); };
  const r100 = (a, b) => Math.round((a + rnd() * (b - a)) / 100) * 100;
  const genMonth = (y, m, upto) => {
    for (let day = 1; day <= upto; day++) {
      const d = new Date(y, m, day), k = ymd(d), w = d.getDay(), wk = w >= 1 && w <= 5;
      if (day === 1) tx(k, 'out', 'housing', 55000, '휴대폰 요금');
      if (day === 10) tx(k, 'out', 'housing', 180000, '관리비');
      if (day === 25) tx(k, 'in', 'salary', 3200000, '월급');
      if (wk) { tx(k, 'out', 'food', r100(8000, 12000), '점심'); tx(k, 'out', 'transport', 3100, '지하철'); if (rnd() < .55) tx(k, 'out', 'cafe', r100(4500, 6500), '커피'); }
      else { if (rnd() < .75) tx(k, 'out', 'living', r100(18000, 65000), '장보기'); if (rnd() < .4) tx(k, 'out', 'food', r100(22000, 46000), '외식'); if (rnd() < .3) tx(k, 'out', 'culture', 15000, '영화'); }
      if (day === 14) tx(k, 'out', 'health', 12800, '약국');
      if (day === 19) tx(k, 'out', 'shopping', 39000, '운동화');
    }
  };
  const pm = new Date(t.getFullYear(), t.getMonth() - 1, 1);
  genMonth(pm.getFullYear(), pm.getMonth(), dim(pm.getFullYear(), pm.getMonth()));
  genMonth(t.getFullYear(), t.getMonth(), t.getDate());
  Object.values(docs).forEach(d => d.items && d.items.sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : 0));

  const sub = (id, name, price, cur, cycle, every, next, back, color) => ({ id, name, price, cur, cycle, every, start: ymd(cycle === 'y' ? addMonths(addDays(t, next), -12 * back) : addMonths(addDays(t, next), -back * every)), color, memo: '', active: true });
  c.subs = [
    sub('ex-s1', '영상 스트리밍', 13500, 'KRW', 'm', 1, 3, 7, '#F2665E'),
    sub('ex-s2', '음악 스트리밍', 10900, 'KRW', 'm', 1, 12, 14, '#3DB86B'),
    sub('ex-s3', '클라우드 200GB', 4400, 'KRW', 'm', 1, 20, 20, '#3B94E6'),
    sub('ex-s4', 'AI 도구', 20, 'USD', 'm', 1, 6, 5, '#9760E0'),
    sub('ex-s5', '쇼핑 멤버십', 7890, 'KRW', 'm', 1, 1, 11, '#F2963A'),
    sub('ex-s6', '도메인 갱신', 22000, 'KRW', 'y', 1, 150, 3, '#7B8189'),
  ];
  const bday = addDays(t, 57);
  c.ddays = [
    { id: 'ex-d1', title: '제주 여행', date: ymd(addDays(t, 38)), mode: 'until', pin: true, color: '#1FA8A0', created: ymd(addDays(t, -30)) },
    { id: 'ex-d2', title: '우리가 만난 날', date: ymd(addDays(t, -412)), mode: 'since', pin: true, color: '#E0589A', created: tk },
    { id: 'ex-d3', title: '엄마 생신', date: ymd(new Date(1963, bday.getMonth(), bday.getDate())), mode: 'yearly', pin: false, color: '#F2963A', created: tk },
    { id: 'ex-d4', title: '자격증 시험', date: ymd(addDays(t, 18)), mode: 'until', pin: true, color: '#5B67EE', created: ymd(addDays(t, -60)) },
  ];
  docs.core = c;
  return docs;
}

/* ───────── 시작 ───────── */
function tick() {
  const k = todayKey();
  if (k !== UI.day) { UI.day = k; if (UI.hDate > k || diffDays(parse(UI.hDate), today()) > 6) UI.hDate = k; renderAll(); return; }
  if (UI.tab === 'today') { const dp = dayProgress(), l = $('#dayline'), b = $('#daybar i'); if (l) l.innerHTML = `<span>${dp.text}</span><span>${dp.left}</span>`; if (b) b.style.width = (dp.pct * 100).toFixed(1) + '%'; }
}
(function boot() {
  let cached = null; try { cached = JSON.parse(lsGet(LS_KEY) || 'null'); } catch { cached = null; }
  if (cached && cached.docs && cached.docs.core) { S.docs = cached.docs; S.dirty = new Set(cached.dirty || []); S.deleted = new Set(cached.deleted || []); }
  else { S.docs = sampleDocs(); S.ephemeral = true; }
  render();
  initSync();
  setInterval(tick, 20000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) tick(); });
})();
})();
</script>
