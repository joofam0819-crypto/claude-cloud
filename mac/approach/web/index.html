<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="APPROACH — 하늘길을 그려 비행기를 착륙시키는 관제 로그라이트. Draw flight paths, land everyone.">
<meta name="theme-color" content="#172349">
<title>APPROACH</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<canvas id="c" aria-label="airspace"></canvas>

<div id="hud" aria-live="polite">
  <div class="hud-left">
    <div class="pill small" id="hud-shift">교대 1</div>
    <div class="score"><span id="hud-score">0</span><span class="mult" id="hud-mult">×1</span></div>
    <div class="pill tiny" id="hud-extras"></div>
  </div>
  <div class="hud-center">
    <div class="timer"><div class="bar" id="hud-bar"></div></div>
    <div class="time" id="hud-time">3:00</div>
  </div>
  <div class="hud-right">
    <div class="pill"><span class="lbl" data-i18n="landings">착륙</span> <b id="hud-landings">0</b></div>
    <div class="pill small" id="hud-traffic">✈ 0</div>
    <div class="incidents" id="hud-incidents" title="incidents"></div>
  </div>
</div>
<div id="hint"></div>
<div id="toast"></div>

<section class="screen" id="title">
  <div class="panel title-panel">
    <h1 class="logo" data-i18n="title">APPROACH</h1>
    <p class="tagline" data-i18n="tagline">하늘길을 그려 비행기를 착륙시키세요</p>
    <div class="buttons">
      <button class="btn primary big" id="btn-start"><span data-i18n="start">근무 시작</span><small id="title-best"></small></button>
      <button class="btn big" id="btn-daily"><span data-i18n="daily">오늘의 교대</span><small id="daily-sub"></small></button>
    </div>
    <div class="buttons row">
      <button class="btn ghost" id="btn-howto" data-i18n="howto">조작법</button>
      <button class="btn ghost" id="btn-stats" data-i18n="stats">기록</button>
      <button class="btn ghost" id="btn-settings" data-i18n="settings">설정</button>
    </div>
    <p class="credit">Space · M · F &nbsp;|&nbsp; Made with Claude Code</p>
  </div>
</section>

<section class="screen" id="howto">
  <div class="panel">
    <h2 data-i18n="howto">조작법</h2>
    <ol id="howto-body"></ol>
    <div class="legend">
      <span><i style="background:#4f8dff"></i> A · Jet / Heavy</span>
      <span><i style="background:#ff9f43"></i> B · Turboprop</span>
      <span><i style="background:#3ddc84"></i> H · Helicopter</span>
    </div>
    <div class="buttons row"><button class="btn primary" id="btn-howto-back" data-i18n="resume">계속</button></div>
  </div>
</section>

<section class="screen" id="pause">
  <div class="panel narrow">
    <h2 data-i18n="paused">일시 정지됨</h2>
    <div class="buttons">
      <button class="btn primary big" id="btn-resume" data-i18n="resume">계속</button>
      <button class="btn" id="btn-pause-restart" data-i18n="restart">다시 시작</button>
      <button class="btn" id="btn-pause-settings" data-i18n="settings">설정</button>
      <button class="btn ghost" id="btn-pause-quit" data-i18n="quit">메인으로</button>
    </div>
  </div>
</section>

<section class="screen" id="upgrade">
  <div class="panel wide">
    <h2 data-i18n="shiftClear">교대 완료!</h2>
    <p class="sub" id="upgrade-summary"></p>
    <h3 data-i18n="pickUpgrade">업그레이드 선택</h3>
    <div class="cards" id="upgrade-cards"></div>
    <p class="sub dim" data-i18n="pickHint">숫자키 1·2·3 또는 클릭</p>
  </div>
</section>

<section class="screen" id="over">
  <div class="panel">
    <h2 id="over-title">근무 종료</h2>
    <p class="sub" id="over-reason"></p>
    <div class="over-score"><span id="over-score">0</span><span class="badge" id="over-newbest" data-i18n="newBest">신기록!</span></div>
    <div class="over-row"><span><b id="over-landings">0</b> <span data-i18n="landings">착륙</span></span><span id="over-shift"></span><span id="over-best"></span></div>
    <p class="planes" id="over-planes"></p>
    <div class="buttons row">
      <button class="btn primary big" id="btn-over-restart" data-i18n="restart">다시 시작</button>
      <button class="btn" id="btn-share" data-i18n="share">결과 복사</button>
      <button class="btn ghost" id="btn-over-quit" data-i18n="quit">메인으로</button>
    </div>
  </div>
</section>

<section class="screen" id="settings">
  <div class="panel narrow">
    <h2 data-i18n="settings">설정</h2>
    <label class="row-set"><span data-i18n="music">음악</span><input type="checkbox" id="set-music"></label>
    <label class="row-set"><span data-i18n="sfx">효과음</span><input type="checkbox" id="set-sfx"></label>
    <label class="row-set"><span data-i18n="shake">화면 흔들림</span><input type="checkbox" id="set-shake"></label>
    <label class="row-set"><span data-i18n="reduceFlash">번쩍임</span><input type="checkbox" id="set-flash"></label>
    <label class="row-set"><span data-i18n="lang">언어</span>
      <select id="set-lang"><option value="auto">Auto</option><option value="ko">한국어</option><option value="en">English</option></select></label>
    <div class="buttons row"><button class="btn primary" id="btn-settings-back" data-i18n="resume">계속</button></div>
  </div>
</section>

<section class="screen" id="stats">
  <div class="panel narrow">
    <h2 data-i18n="stats">기록</h2>
    <div class="stats" id="stats-body"></div>
    <div class="buttons row"><button class="btn primary" id="btn-stats-back" data-i18n="resume">계속</button></div>
  </div>
</section>

<script src="js/rng.js"></script>
<script src="js/content.js"></script>
<script src="js/sim.js"></script>
<script src="js/audio.js"></script>
<script src="js/fx.js"></script>
<script src="js/input.js"></script>
<script src="js/save.js"></script>
<script src="js/render.js"></script>
<script src="js/ui.js"></script>
<script src="js/game.js"></script>
</body>
</html>
