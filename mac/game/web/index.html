<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Game Shell</title>
<style>
html,body{margin:0;height:100%;background:#000;color:#fff;overflow:hidden;font-family:-apple-system,system-ui,sans-serif}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script src="js/rng.js"></script>
<script src="js/audio.js"></script>
<script src="js/fx.js"></script>
<script src="js/input.js"></script>
<script src="js/save.js"></script>
<script>
(() => {
  const cv = document.getElementById('c'), ctx = cv.getContext('2d');
  const parts = new Particles(), cam = new Camera(), rng = new RNG(dailySeed());
  let W = 0, H = 0, dpr = 1, last = performance.now(), t = 0;
  function resize(){ dpr = Math.min(2, window.devicePixelRatio||1); W = innerWidth; H = innerHeight; cv.width = W*dpr; cv.height = H*dpr; }
  addEventListener('resize', resize); resize(); Input.attach(cv);
  function frame(now){
    const dt = Math.min(0.05, (now-last)/1000); last = now; t += dt;
    if (Input.anyPressed()) { Audio.unlock(); Audio.startMusic(1); Audio.setIntensity(1); Audio.tone({f:660,f2:990,dur:0.12,g:0.2}); parts.burst(W/2,H/2,80,{color:['#7df','#f7d','#fff'],speed:300,life:0.8,glow:12}); cam.addShake(8); }
    cam.update(dt); parts.update(dt);
    ctx.setTransform(dpr,0,0,dpr,cam.sx,cam.sy); ctx.fillStyle='#06060c'; ctx.fillRect(-20,-20,W+40,H+40);
    ctx.fillStyle='#fff'; ctx.font='700 48px system-ui'; ctx.textAlign='center'; ctx.fillText('GAME SHELL OK', W/2, H/2 - 40);
    ctx.font='400 18px system-ui'; ctx.fillStyle='#9ab'; ctx.fillText('press any key', W/2, H/2 + 10);
    parts.draw(ctx); Input.endFrame(); requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  window.__game = { ready: true, resetProgress(){ Save.reset(); location.reload(); }, particles: () => parts.p.length };
})();
</script>
</body>
</html>
